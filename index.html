<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charkey="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Piano JavaScript</title>
</head>
<body>
     <div class="teclado">
        <header>
            <h2>PIANO</h2>
            <div class="column controle-volume">
                <span>Volume</span> <input type="range" min="0" max="1" value="0.5" step="any">
            </div>
            <div class="column teclas-checkbox">
                <span>Mostrar teclas</span> <input type="checkbox" checked>
            </div>
        </header>
        <ul class="piano-teclas">
            <li class="tecla branca" data-key="a"><span>a</span></li>
            <li class="tecla preta" data-key="w"><span>w</span></li>
            <li class="tecla branca" data-key="s"><span>s</span></li>
            <li class="tecla preta" data-key="e"><span>e</span></li>
            <li class="tecla branca" data-key="d"><span>d</span></li>
            <li class="tecla branca" data-key="f"><span>f</span></li>
            <li class="tecla preta" data-key="t"><span>t</span></li>
            <li class="tecla branca" data-key="g"><span>g</span></li>
            <li class="tecla preta" data-key="y"><span>y</span></li>
            <li class="tecla branca" data-key="h"><span>h</span></li>
            <li class="tecla preta" data-key="u"><span>u</span></li>
            <li class="tecla branca" data-key="j"><span>j</span></li>
            <li class="tecla branca" data-key="k"><span>k</span></li>
            <li class="tecla preta" data-key="o"><span>o</span></li>
            <li class="tecla branca" data-key="l"><span>l</span></li>
            <li class="tecla preta" data-key="p"><span>p</span></li>
            <li class="tecla branca" data-key="ç"><span>ç</span></li>
        </ul>
     </div>
     <!-- <script src="../OpenConsole.js"></script> -->
</body>
</html>
